server {
    listen 80;
    server_name tuihuo.sim101.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/sim101-acme; }
    location / { return 308 https://tuihuo.sim101.cn$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name tuihuo.sim101.cn;
    ssl_certificate /etc/letsencrypt/live/tuihuo.sim101.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuihuo.sim101.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        access_log off;
    }
}
